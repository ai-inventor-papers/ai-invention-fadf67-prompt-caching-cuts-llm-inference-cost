entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python loguru==0.7.3 matplotlib==3.11.2 numpy==2.5.3"
  - path: __pycache__/
    delete: regenerable
    source: "uv run method.py  # regenerated automatically on next Python execution"
